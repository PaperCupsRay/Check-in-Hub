name: Check-in Runner

# 面板（Cloudflare Worker）通过 repository_dispatch 触发；
# 也可每天定时跑一次，或手动触发（可勾选通道）。
on:
  repository_dispatch:
    types: [checkin-run]
  schedule:
    - cron: "30 0 * * *" # UTC 00:30 = 北京时间 08:30
  workflow_dispatch:
    inputs:
      runners:
        description: "要执行的通道（逗号分隔：gha_api,gha_browser）"
        required: false
        default: "gha_api"

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  # ---------- 通道一：纯 HTTP（Azure 出口 IP，过「封 CDN-IP」站） ----------
  api:
    if: ${{ github.event_name != 'repository_dispatch' || contains(github.event.client_payload.runners, 'gha_api') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run check-ins (http)
        env:
          HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          HUB_ACCESS_PASSWORD: ${{ secrets.HUB_ACCESS_PASSWORD }}
          RUNNERS: ${{ github.event_name == 'repository_dispatch' && join(github.event.client_payload.runners, ',') || inputs.runners }}
        run: node scripts/gha-checkin.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-results-api
          path: |
            gha-results.json
            gha-fallback.json
          retention-days: 7

  # ---------- 通道二：CloakBrowser 过 WAF（gorouter / SeekAi 等 CF 挑战站） ----------
  # 同时承接降级链的最后一级：gha_api 失败的渠道由本 job 用浏览器模拟登录重试。
  browser:
    if: ${{ always() && (github.event_name != 'repository_dispatch' || contains(github.event.client_payload.runners, 'gha_browser')) }}
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # api job 产出的失败渠道清单（gha_api → gha_browser 降级源）。
      # api job 被跳过时该 artifact 不存在，continue-on-error 静默放行。
      - name: Download api fallback list
        if: ${{ github.event_name != 'repository_dispatch' || contains(github.event.client_payload.runners, 'gha_api') }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkin-results-api
          path: api-artifact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 依赖与 kppq66/gorouter-turnstile-checkin 对齐：装最新 cloakbrowser（反检测补丁随版本更新，
      # 0.4.x 的补丁过不了当前 Turnstile），并且不跑 `python -m cloakbrowser install`
      # —— launch_async() 内部会调 ensure_binary() 自动下载内核，那个显式步骤才是 exit 139 段错误的来源。
      - name: Install system deps (xvfb + fonts + chromium libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon0 libgbm1 libnss3             fonts-liberation fonts-dejavu-core fonts-noto-color-emoji fonts-wqy-zenhei

      - name: Install CloakBrowser (latest)
        run: |
          python -m pip install --upgrade pip
          pip install cloakbrowser

      # 浏览器内完成 Turnstile 解证 + 页面内 fetch 签到（参照 kppq66 流程）。
      # 请求从真实浏览器发出，TLS/IP/cookie 一致，绕开 TLS 指纹拦截。
      - name: Turnstile check-in (in-browser)
        env:
          HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          HUB_ACCESS_PASSWORD: ${{ secrets.HUB_ACCESS_PASSWORD }}
          CHECKIN_HEADLESS: "false" # xvfb 有头模式，CF 信任度更高
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"
          # gha_api 失败渠道清单（api job 的 artifact），供 browser job 降级重试
          API_FALLBACK_LIST: "api-artifact/gha-fallback.json"
        run: |
          set -e
          xvfb-run -a --server-args="-screen 0 1366x768x24" python scripts/browser-checkin.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-results-browser
          path: |
            gha-results.json
          retention-days: 7
