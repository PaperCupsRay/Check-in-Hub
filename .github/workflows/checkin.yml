name: Check-in Runner

# 面板（Cloudflare Worker）通过 repository_dispatch 触发；
# 每日定时由 Worker cron（UTC 00:30）统一调度（全渠道+降级链），GHA 不再单独
# schedule —— 旧 schedule 只跑 gha_api 通道、覆盖不全，且会和 Worker cron 双跑。
# 手动触发保留（可勾选通道）。
on:
  repository_dispatch:
    types: [checkin-run]
  workflow_dispatch:
    inputs:
      runners:
        description: "要执行的通道（逗号分隔：gha_api,gha_browser）"
        required: false
        default: "gha_api"

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  # ---------- 通道一：纯 HTTP（Azure 出口 IP，过「封 CDN-IP」站） ----------
  api:
    if: ${{ github.event_name != 'repository_dispatch' || contains(github.event.client_payload.runners, 'gha_api') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run check-ins (http)
        env:
          HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          HUB_ACCESS_PASSWORD: ${{ secrets.HUB_ACCESS_PASSWORD }}
          RUNNERS: ${{ github.event_name == 'repository_dispatch' && join(github.event.client_payload.runners, ',') || inputs.runners }}
        run: node scripts/gha-checkin.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-results-api
          path: |
            gha-results.json
            gha-fallback.json
          retention-days: 7

  # ---------- 通道二：Camoufox 过 WAF（gorouter / SeekAi 等 CF 挑战站） ----------
  # 同时承接降级链的最后一级：gha_api 失败的渠道由本 job 用浏览器模拟登录重试。
  browser:
    if: ${{ always() && (github.event_name != 'repository_dispatch' || contains(github.event.client_payload.runners, 'gha_browser')) }}
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # api job 产出的失败渠道清单（gha_api → gha_browser 降级源）。
      # api job 被跳过时该 artifact 不存在，continue-on-error 静默放行。
      - name: Download api fallback list
        if: ${{ github.event_name != 'repository_dispatch' || contains(join(github.event.client_payload.runners || '[]', ','), 'gha_api') }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkin-results-api
          path: api-artifact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Camoufox 自带 Xvfb 管理（headless="virtual"），但 xvfb 这个二进制还是要装。
      # 字体不能省：缺中文字体时页面渲染成方块，且字体列表本身就是指纹的一部分。
      - name: Install system deps (xvfb + fonts + gtk libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 \
            fonts-liberation fonts-dejavu-core fonts-noto-color-emoji fonts-wqy-zenhei

      # camoufox fetch 下载 Firefox 内核；geoip 附加包用于按代理出口 IP 推时区/经纬度
      # （见 browser_page() 里的 geoip=True，避免「美国 IP + 上海时区」这种矛盾指纹）。
      - name: Install Camoufox
        run: |
          python -m pip install --upgrade pip
          pip install 'camoufox[geoip]'
          python -m camoufox fetch

      # 浏览器内完成 Turnstile 解证 + 页面内 fetch 签到。
      # 请求从真实浏览器发出，TLS/IP/cookie 一致，绕开 TLS 指纹拦截。
      - name: Turnstile check-in (in-browser)
        env:
          HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          HUB_ACCESS_PASSWORD: ${{ secrets.HUB_ACCESS_PASSWORD }}
          # 必须有头：无头下 Turnstile 组件 rendered 成功但永不签发 token（实测）。
          # 脚本在 CI 里会把它翻译成 Camoufox 的 headless="virtual"，自己拉 Xvfb。
          CHECKIN_HEADLESS: "false"
          # Camoufox 虚拟屏默认 1x1x24 —— 那样 Turnstile iframe 的 bounding_box 拿不到
          # 有效坐标，拟人点击点不中。这里给一块真实尺寸的 framebuffer。
          CAMOUFOX_VIRTUAL_DISPLAY_SIZE: "1366x768x24"
          # gha_api 失败渠道清单（api job 的 artifact），供 browser job 降级重试
          API_FALLBACK_LIST: "api-artifact/gha-fallback.json"
        run: python scripts/browser-checkin.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-results-browser
          path: |
            gha-results.json
          retention-days: 7
