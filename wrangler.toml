name = "checkin-hub"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Allow importing ui.html as a text module
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

# Cloudflare KV — channels auto-persist (UI + cron)
[[kv_namespaces]]
binding = "CHECKIN_KV"
id = "896e2bab41be4b0aa48b33306f2b6312"
preview_id = "ca025ec4d00b4e8c9ebac57730f97dbf"

# Daily cron (UTC 00:30 = 北京时间 08:30)。scheduled() 不需要 CRON_SECRET
# （那只保护手动 HTTP 端点 /api/cron/run）。失败渠道自动降级 worker→gha_api→gha_browser。
[triggers]
crons = ["30 0 * * *"]

[vars]
# APP_TITLE = "Check-in Hub"
# Leave empty / unset to disable access password (open panel)
# ACCESS_PASSWORD is better set as a secret:
#   npx wrangler secret put ACCESS_PASSWORD
# Optional dedicated signing secret (falls back to ACCESS_PASSWORD):
#   npx wrangler secret put SESSION_SECRET
# SESSION_TTL_SECONDS = "604800"
# Leave empty to disable cron endpoint
# CRON_SECRET = ""
